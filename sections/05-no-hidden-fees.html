    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', system-ui, sans-serif; color: #0F1338; margin: 0; font-size: 1.1rem; padding-top: 66px; }
    h1, h2, h3 { font-family: 'DM Serif Display', Georgia, serif; letter-spacing: -0.02em; }

    /* Nav */
    .nav-link {
      color: #0F1338;
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .nav-link:hover { color: #9DAAF2; }

    /* Hero */
    .hero-bg {
      background-color: #fff;
      position: relative;
    }

    /* Form card */
    .form-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(15,19,56,0.25), 0 2px 8px rgba(15,19,56,0.1);
    }

    /* Buttons */
    .btn-primary {
      background-color: #9DAAF2;
      color: #0F1338;
      font-weight: 800;
      border-radius: 999px;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
